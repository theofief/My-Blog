<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>My blog</title>
  </head>
  <body>
    <header>
      <h1>My Blog</h1>
      <div>
        <nav id="mySidenav" class="sidenav">
          <ul>
            <a id="closeBtn" href="#" class="close">×</a>
            <li><a href="/My-Blog/">Home</a></li>
            <li><a href="https://github.com/theofief">About</a></li>
            <li><a href="/My-Blog/contact.html">Contact</a></li>
            <button id="mode-toggle">Switch theme</button>
          </ul>
        </nav>
        <a href="#" id="openBtn">
          <span class="burger-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </a>
      </div>
    </header>

    <main>
      <h2>Get in Touch</h2>
      <p>
        If you have any questions or comments, feel free to reach out at
        <a href="mailto:theo.tf.studio@gmail.com">theo.tf.studio@gmail.com</a>
        or use the form below.
      </p>

      <form id="contactForm" method="POST" action="/send-message">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />
        <div class="error" id="nameError"></div>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" />
        <div class="error" id="emailError"></div>

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>
        <div class="error" id="messageError"></div>

        <button type="submit">Send</button>
      </form>
    </main>

    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          // Reset errors
          document.getElementById("nameError").textContent = "";
          document.getElementById("emailError").textContent = "";
          document.getElementById("messageError").textContent = "";

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const message = document.getElementById("message").value.trim();

          let valid = true;

          if (!name) {
            document.getElementById("nameError").textContent =
              "Please enter your name.";
            valid = false;
          }

          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            document.getElementById("emailError").textContent =
              "Please enter a valid email address.";
            valid = false;
          }

          if (!message) {
            document.getElementById("messageError").textContent =
              "Please enter your message.";
            valid = false;
          }

          if (valid) {
            const formData = new FormData(this);

            fetch(this.action, {
              method: "POST",
              body: formData,
              headers: {
                Accept: "application/json",
              },
            })
              .then((response) => {
                if (response.ok) {
                  alert("📨 Message sent successfully!");
                  this.reset();
                } else {
                  alert("❌ An error occurred. Please try again.");
                }
              })
              .catch((error) => {
                console.error("Error:", error);
                alert("❌ An error occurred. Please try again.");
              });
          }
        });
    </script>
    <script type="text/javascript" src="js/script.js"></script>
  </body>
</html>
